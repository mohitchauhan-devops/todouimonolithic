trigger:
- none

pool: powermanage-pool


stages:
  - stage: Setup_nodejs
    displayName: Setup Nodejs
    jobs:
      - job: Install_Nodejs
        steps:
        - checkout: self

        - task: NodeTaskRunnerInstaller@0
          inputs:
            nodeVersion: '16'

        # - task: Npm@1
        #   inputs:
        #     command: 'install'
        #     workingDir: '$(Build.SourcesDirectory)'
          
        # - task: Npm@1
        #   inputs:
        #     command: 'custom'
        #     workingDir: '$(Build.SourcesDirectory)'
        #     customCommand: 'run build'
      
        - task: PowerShell@2
          displayName: Install and Build React app
          inputs:
            targetType: 'inline'
            workingDirectory: '$(Build.SourcesDirectory)'
            script: |
              npm install
              npm run build
              dir build
       