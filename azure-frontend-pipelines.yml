trigger: none

pool: powermanage-pool

steps:

- task: NodeAndNpmTool@1
  inputs:
    versionSpec: '16.x'

- task: Npm@1
  inputs:
    command: 'install'

- task: Npm@1
  inputs:
    command: 'custom'
    customCommand: 'npm run build'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Pipeline.Workspace)/Build'
    artifact: 'todoui'
    publishLocation: 'pipeline'