trigger: none

pool: powermanage-pool

steps:

- task: NodeAndNpmTool@1
  displayName: Install Nodejs version
  inputs:
    versionSpec: '16.x'

- task: Npm@1
  displayName: npm install
  inputs:
    command: 'install'

- task: Npm@1
  displayName: npm run build
  inputs:
    command: 'custom'
    customCommand: 'run build'

- task: PublishPipelineArtifact@1
  displayName: publish artifact
  inputs:
    targetPath: '$(Build.SourcesDirectory)/build'
    artifact: 'todoui'
    publishLocation: 'pipeline'

- task: ArchiveFiles@2
  displayName: Archive Artifact
  inputs:
    rootFolderOrFile: '$(Build.SourcesDirectory)/build'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/todoui.zip'
    replaceExistingArchive: true

- task: PublishPipelineArtifact@1
  displayName: publish artifact zip
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/todoui.zip'
    artifact: 'todoui.zip'
    publishLocation: 'pipeline'

- task: CopyFilesOverSSH@0
  inputs:
    sshEndpoint: 'frontendssh'
    sourceFolder: '$(Build.ArtifactStagingDirectory)'
    contents: 'todoui.zip'
    targetFolder: '/var/www/html/'
    readyTimeout: '20000'

- task: SSH@0
  inputs:
    sshEndpoint: 'frontendssh'
    runOptions: 'commands'
    commands: |
      echo "===== DEPLOY START ====="
      
      
            echo "===== ZIP BEFORE ====="
            ls -lah /var/www/html/todoui.zip
      
      
            echo "===== EXTRACT ====="
            /usr/bin/unzip -o /var/www/html/todoui.zip -d /var/www/html/
      
      
            echo "===== VERIFY ====="
            ls -lah /var/www/html
            test -f /var/www/html/index.html
            test -d /var/www/html/static
      
      
            echo "===== REMOVE ZIP ====="
            rm -f /var/www/html/todoui.zip
    readyTimeout: '20000'